services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cc-net

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cc-net

  api:
    build:
      context: ./api
    container_name: cc-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: ${API_PORT}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: "*"
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT}:${API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT}/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cc-net

  dashboard:
    build:
      context: ./dashboard
    container_name: cc-dashboard
    restart: unless-stopped
    ports:
      - "5629:5629"
    depends_on:
      - api
    networks:
      - cc-net

  appsmith:
    image: appsmith/appsmith-ce
    container_name: cc-appsmith
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - appsmith_data:/appsmith-stacks
    depends_on:
      - api
    networks:
      - cc-net

  metabase:
    image: metabase/metabase:latest
    container_name: cc-metabase
    restart: unless-stopped
    environment:
      MB_DB_FILE: ${METABASE_DB_FILE}
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
    networks:
      - cc-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cc-net

  grafana:
    image: grafana/grafana:latest
    container_name: cc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - cc-net

  n8n:
    image: n8nio/n8n:latest
    container_name: cc-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      DB_TYPE: sqlite
      GENERIC_TIMEZONE: America/New_York
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows
    depends_on:
      - api
    networks:
      - cc-net

  # Ollama runs natively on the host (not in Docker) for best GPU performance.
  # The API connects via host.docker.internal:11434.
  # To run Ollama in Docker instead, uncomment below:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: cc-ollama
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_HOST: ${OLLAMA_HOST}
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - cc-net

networks:
  cc-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  appsmith_data:
  metabase_data:
  prometheus_data:
  grafana_data:
  n8n_data:
  ollama_data:
